[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "libtestingtools"
description = "Módulo para aprendisagem e construção de projetos Python"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [
    { name = "Lucas Fonseca Merino", email = "lucasfmerino@gmail.com" },
]
dynamic = ["version"]
dependencies = [
    "requests",
]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: GNU Affero General Public License v3 or later (AGPLv3+)",
    "Operating System :: OS Independent",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Framework :: Pytest",
]

[project.urls]
Homepage = "https://github.com/lucasfmerino/dev_tools_tests"

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-cov",
    "pytest-mock",
    "coverage",
    "flake8",
    "mypy",
    "twine",
]

[tool.setuptools.dynamic]
version = { attr = "libtestingtools.__version__" }

[tool.setuptools.packages.find]
include = ["libtestingtools*"]
exclude = ["libtestingtools.tests*"]

[tool.setuptools.package-data]
libtestingtools = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["libtestingtools/tests"]

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true
