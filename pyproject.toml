[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.backends._legacy:_Backend"

[project]
name = "libtestingtools"
version = "0.2"
description = "Modulo para aprendisagem e construcao de projetos Python"
readme = "README.md"
license = "AGPL-3.0-or-later"
requires-python = ">=3.10"
authors = [
    { name = "Lucas Fonseca Merino", email = "lucasfmerino@gmail.com" },
]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: GNU Affero General Public License v3 or later (AGPLv3+)",
    "Operating System :: OS Independent",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Framework :: Pytest",
]
dependencies = [
    "requests>=2.28",
]

[project.urls]
Homepage = "https://github.com/lucasfmerino/dev_tools_tests"
Repository = "https://github.com/lucasfmerino/dev_tools_tests"

[tool.setuptools.packages.find]
exclude = ["tests", "tests.*"]

[tool.pytest.ini_options]
testpaths = ["libtestingtools"]

[tool.flake8]
max-line-length = 120
exclude = ["venv"]
